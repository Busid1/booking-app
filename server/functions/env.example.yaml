# Plantilla de variables para Cloud Run. Copia este archivo como env.yaml (ignorado por git),
# rellena los valores y despliega con:
#   gcloud run deploy bookly-api --source . --region europe-west1 --env-vars-file env.yaml
# Formato YAML: NOMBRE: "valor" (dos puntos y espacio). Borra las líneas que no uses.

# --- Obligatorias
DATABASE_URL: "postgresql://usuario:contraseña@host/neondb?sslmode=require"
JWT_SECRET: "genera-uno-largo-y-aleatorio"

# --- Imágenes (Cloudinary)
CLOUDINARY_CLOUD_NAME: ""
CLOUDINARY_API_KEY: ""
CLOUDINARY_API_SECRET: ""

# --- Emails (Resend)
RESEND_API_KEY: ""
MAIL_FROM: "Mi negocio <citas@midominio.com>"
# NOTIFY_EMAIL: "avisos@midominio.com"
PUBLIC_WEB_URL: "https://bookly-39896.web.app"

# --- Recordatorios (Cloud Scheduler envía este valor en la cabecera X-Cron-Secret)
CRON_SECRET: ""

