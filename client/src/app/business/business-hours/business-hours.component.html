<app-modal [open]="open" (closed)="closed.emit()" title="Horario de atención" subtitle="Define los tramos en los que se pueden reservar citas." size="lg">
  <div class="mb-4 flex justify-end">
    <button type="button" class="btn btn-ghost btn-sm" (click)="copyMondayToWeekdays()">
      <i class="fas fa-copy"></i> Copiar lunes a días laborables
    </button>
  </div>

  <div class="space-y-3">
    @for (day of days; track $index; let i = $index) {
      <div class="rounded-2xl border p-4 transition" [class]="day.isClosed ? 'border-slate-200 bg-slate-50' : 'border-brand-100 bg-white'">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <h3 class="w-24 font-bold">{{ dayNames[i] }}</h3>

          <button type="button" role="switch" [attr.aria-checked]="!day.isClosed" (click)="toggleClosed(day)"
            class="flex items-center gap-2.5 text-sm font-semibold" [class]="day.isClosed ? 'text-slate-500' : 'text-accent-700'">
            <span class="relative h-6 w-11 rounded-full transition" [class]="day.isClosed ? 'bg-slate-300' : 'bg-accent-500'">
              <span class="absolute top-0.5 size-5 rounded-full bg-white shadow transition-all" [class]="day.isClosed ? 'left-0.5' : 'left-[1.375rem]'"></span>
            </span>
            {{ day.isClosed ? 'Cerrado' : 'Abierto' }}
          </button>
        </div>

        @if (!day.isClosed) {
          <div class="mt-4 flex flex-wrap items-end gap-3">
            @for (block of day.timeBlocks; track $index; let x = $index) {
              <div class="flex items-end gap-2 rounded-xl bg-slate-50 p-2.5">
                <app-timePicker label="Apertura" [value]="block.openTime" [invalid]="isBlockInvalid(block)" (timeChanged)="block.openTime = $event" />
                <span class="pb-2.5 text-slate-400">–</span>
                <app-timePicker label="Cierre" [value]="block.closeTime" [invalid]="isBlockInvalid(block)" (timeChanged)="block.closeTime = $event" />
                <button type="button" class="btn-icon mb-0.5 text-rose-500 hover:bg-rose-50 hover:text-rose-600" (click)="removeBlock(day, x)" aria-label="Quitar tramo">
                  <i class="fas fa-trash-can text-sm"></i>
                </button>
              </div>
            }
            <button type="button" class="btn btn-secondary btn-sm mb-2.5" (click)="addBlock(day)">
              <i class="fas fa-plus"></i> Tramo
            </button>
          </div>
        }
      </div>
    }
  </div>

  <div modal-footer class="flex justify-end gap-2 border-t border-slate-100 px-5 py-4 sm:px-6">
    <button type="button" class="btn btn-secondary" (click)="closed.emit()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="isSaving()">
      @if (isSaving()) { <span class="spinner size-4"></span> Guardando… } @else { <i class="fas fa-floppy-disk"></i> Guardar horario }
    </button>
  </div>
</app-modal>
