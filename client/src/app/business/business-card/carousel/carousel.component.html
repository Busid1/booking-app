<div class="relative w-full overflow-hidden rounded-b-none rounded-t-xl">
  <div class="absolute z-10 bottom-3 right-0 px-3 py-1 rounded-full text-sm font-medium text-white">
    <button *ngIf="isAdmin()" (click)="openModal()" type="button"
      class="p-3 text-md font-medium bg-white hover:bg-slate-200 transition rounded-lg flex items-center justify-center gap-2">
      <i class="fas fa-images text-gray-600" aria-hidden="true"></i>
    </button>
  </div>

  <div class="flex transition-transform duration-500" [style.transform]="'translateX(-' + currentIndex * 100 + '%)'">
    <div *ngFor="let slide of slides" class="flex-shrink-0 w-full h-64 md:h-96">
      <ng-container *ngIf="slide; else placeholder">
        <img [src]="slide" alt="Slide" class="w-full h-full object-cover rounded-b-none rounded-t-xl" />
      </ng-container>
      <ng-template #placeholder>
        <img src="https://www.svgrepo.com/show/508699/landscape-placeholder.svg" alt="Placeholder"
          class="w-full h-full object-cover rounded-b-none rounded-t-xl" />
      </ng-template>
    </div>

  </div>

  <div class="absolute bottom-4 left-1/2 transform -translate-x-1/3 flex justify-center items-center space-x-2">
    <button *ngFor="let slide of slides; let i = index" class="w-3 h-3 rounded-full"
      [ngClass]="{'bg-white': i === currentIndex, 'bg-gray-400': i !== currentIndex}" (click)="goToSlide(i)"></button>
  </div>

  <button (click)="prev()"
    class="absolute top-1/2 left-2 flex items-center justify-center -translate-y-1/2 bg-white/75 size-10 rounded-full">
    <i class="fas fa-chevron-left text-md"></i>
  </button>
  <button (click)="next()"
    class="absolute top-1/2 right-2 flex items-center justify-center -translate-y-1/2 bg-white/75 size-10 rounded-full">
    <i class="fas fa-chevron-right text-md"></i>
  </button>
</div>

<div *ngIf="isModalOpen" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50">
  <div class="bg-white rounded-2xl p-6 w-full max-w-lg shadow-lg">
    <h2 class="text-xl font-semibold mb-4 text-gray-800">Actualizar Imágenes</h2>

    <div class="grid grid-cols-3 gap-4">
      <div *ngFor="let preview of previews; let i = index" class="relative">

        <label
          class="w-full h-32 rounded-lg border border-dashed border-gray-300 flex items-center justify-center cursor-pointer hover:bg-gray-100">

          <img *ngIf="preview || slides[i]" [src]="preview || slides[i]"
            class="w-full h-full object-cover rounded-lg" />

          <span *ngIf="!preview && !slides[i]" class="text-gray-500 text-sm">
            <i class="fas fa-upload mr-1"></i>
            Subir imagen
          </span>

          <input *ngIf="!preview && !slides[i]" type="file" (change)="onFileChange($event, i)" class="hidden" />
        </label>

        <button *ngIf="slides[i] || preview[i]" (click)="removeImage(i)"
          class="absolute top-1 right-1 bg-red-500 text-white rounded-full size-7 flex items-center justify-center">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <p class="mt-3 text-gray-700 text-md">Solo imágenes (PNG, JPEG, JPG, WEBP...)</p>

    <div class="mt-3 flex justify-end space-x-4">
      <button (click)="closeModal()" class="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">
        Cancelar
      </button>
      <button (click)="handleUploadImages()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
        Guardar
      </button>
    </div>
  </div>
</div>
