<app-modal [open]="open" (closed)="closeModal.emit()" [title]="isEdit ? 'Editar cita' : 'Nueva cita'"
  [subtitle]="isEdit ? 'Modifica los datos de la cita' : 'Registra una cita para un cliente'">
  <form id="appointmentForm" (ngSubmit)="handleSubmit()" class="grid gap-5">
    <div>
      <label class="label" for="ap-service">Servicio</label>
      <select id="ap-service" name="serviceId" class="input" [ngModel]="form().serviceId" (ngModelChange)="patch({ serviceId: $event })" required>
        <option value="" disabled>Selecciona un servicio</option>
        @for (service of store.services(); track service.id) {
          <option [value]="service.id">{{ service.title }} · {{ service.duration }} min · {{ service.price | currency: 'EUR' }}</option>
        }
      </select>
    </div>

    <div>
      <label class="label" for="ap-client">Cliente</label>
      <div class="relative">
        <i class="fas fa-user pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-sm text-slate-400"></i>
        <input id="ap-client" name="clientName" class="input pl-10" placeholder="Nombre del cliente" maxlength="80"
          [ngModel]="form().clientName" (ngModelChange)="patch({ clientName: $event })" required />
      </div>
    </div>

    <div class="grid gap-4 sm:grid-cols-3">
      <div>
        <label class="label" for="ap-date">Fecha</label>
        <input id="ap-date" name="date" type="date" class="input" [min]="isEdit ? '' : minDate"
          [ngModel]="form().date" (ngModelChange)="patch({ date: $event })" required />
      </div>
      <div>
        <label class="label" for="ap-start">Inicio</label>
        <input id="ap-start" name="startTime" type="time" step="300" class="input"
          [ngModel]="form().startTime" (ngModelChange)="patch({ startTime: $event })" required />
      </div>
      <div>
        <label class="label" for="ap-end">Fin</label>
        <input id="ap-end" type="time" class="input" [value]="endTime()" disabled />
      </div>
    </div>

    @if (outsideHours()) {
      <div class="flex items-start gap-3 rounded-xl border border-amber-200 bg-amber-50 p-3.5 text-sm text-amber-800">
        <i class="fas fa-triangle-exclamation mt-0.5"></i>
        <span>La cita queda fuera del horario de atención. Como administrador puedes guardarla igualmente.</span>
      </div>
    }
  </form>

  <div modal-footer class="flex justify-end gap-2 border-t border-slate-100 px-5 py-4 sm:px-6">
    <button type="button" class="btn btn-secondary" (click)="closeModal.emit()">Cancelar</button>
    <button type="submit" form="appointmentForm" class="btn btn-primary" [disabled]="isSaving()">
      @if (isSaving()) {
        <span class="spinner size-4"></span> Guardando…
      } @else {
        <i class="fas" [class.fa-floppy-disk]="isEdit" [class.fa-calendar-plus]="!isEdit"></i> {{ isEdit ? 'Guardar cambios' : 'Crear cita' }}
      }
    </button>
  </div>
</app-modal>
