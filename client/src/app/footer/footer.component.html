<footer class="border-t border-slate-200/70 bg-white/60 backdrop-blur">
  <div class="container-page flex flex-col items-center justify-between gap-4 py-8 sm:flex-row">
    <div class="flex flex-col items-center gap-1 sm:items-start">
      <a routerLink="/" class="flex items-center gap-2 font-extrabold text-slate-900">
        @if (store.businessInfo().logo) {
          <img [src]="store.businessInfo().logo" alt="" class="h-7 w-auto max-w-[2.5rem] object-contain" />
        } @else {
          <span class="grid size-7 place-items-center rounded-lg bg-brand-600 text-xs text-white"><i class="fas fa-calendar-check"></i></span>
        }
        {{ store.businessInfo().name || 'Reserva online' }}
      </a>
      <p class="text-sm text-slate-500">© {{ year }} {{ store.businessInfo().name }}</p>
    </div>

    @if (socials().length) {
      <ul class="flex flex-wrap items-center justify-center gap-1">
        @for (social of socials(); track social.key) {
          <li>
            <a [href]="social.url" target="_blank" rel="noopener" class="btn-icon" [attr.aria-label]="social.label" [title]="social.label">
              <i class="text-lg" [class]="social.icon"></i>
            </a>
          </li>
        }
      </ul>
    }
  </div>
</footer>
